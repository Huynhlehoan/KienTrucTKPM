events {}

http {
    # Khai báo nhóm backend gồm 2 service flask
    upstream my_flask_cluster {
        server flask1:5000;
        server flask2:5000;
    }

    server {
        listen 80;
        location / {
            # Bắn request vào cái nhóm đã khai báo ở trên
            proxy_pass http://my_flask_cluster;
        }
    }
}