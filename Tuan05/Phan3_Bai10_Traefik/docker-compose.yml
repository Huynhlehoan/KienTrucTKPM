services:
  # 1.  gác cổng Traefik
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true" # Mở dashboard quản lý
      - "--providers.docker=true" # Báo cho nó biết là đang xài Docker
      - "--providers.docker.exposedbydefault=false" # Không tự động mở port bậy bạ
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"     # Cổng cho khách vào web
      - "8080:8080" # Cổng để m xem Dashboard quản lý Traefik
    volumes:
      # Dòng ma thuật: Cho phép Traefik chui vào lõi Docker để nghe ngóng các container khác
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # 2. Ứng dụng web test (Dùng image whoami siêu nhẹ)
  webapp1:
    image: traefik/whoami
    labels:
      - "traefik.enable=true" # Cho phép Traefik quản lý cục này
      # Định tuyến: Nếu khách gõ đúng domain này thì cho vào webapp1
      - "traefik.http.routers.webapp1.rule=Host(`web1.localhost`)" 

  # 3. Thêm 1 web nữa để test
  webapp2:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webapp2.rule=Host(`web2.localhost`)"