<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CMS Kernel - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

<div class="max-w-6xl mx-auto grid grid-cols-3 gap-8">

    <div class="col-span-1 bg-white p-6 rounded-lg shadow-md h-fit">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">🔌 Quản lý Plugin</h2>

        <div class="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg shadow-sm">
            <h3 class="font-bold text-blue-800 mb-2">Thêm Plugin (.jar)</h3>
            <input type="file" id="plugin-file" class="mb-3 w-full text-sm bg-white p-1 rounded border border-gray-300">
            <input type="text" id="plugin-class" placeholder="Tên class (VD: com.abc.MyPlugin)" class="w-full mb-3 p-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <button onclick="uploadPlugin()" class="bg-blue-600 text-white font-semibold px-3 py-2 rounded w-full hover:bg-blue-700 transition">
                Upload & Chạy
            </button>
        </div>

        <div id="plugin-list" class="space-y-3">
            <p class="text-gray-500 italic text-center">Đang tải plugin...</p>
        </div>
    </div>

    <div class="col-span-2 space-y-8">

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">✍️ Viết bài mới</h2>
            <input type="text" id="post-title" placeholder="Tiêu đề bài viết..." class="w-full mb-3 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <textarea id="post-content" rows="4" placeholder="Nội dung bài viết..." class="w-full mb-3 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"></textarea>
            <button onclick="createPost()" class="bg-gray-800 text-white font-semibold px-6 py-2 rounded hover:bg-gray-900 transition">
                Đăng bài
            </button>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">📰 Danh sách bài viết</h2>
            <div id="post-list" class="space-y-4">
            </div>
        </div>

    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api/kernel';

    // 1. Lấy danh sách Plugin và hiển thị
    async function loadPlugins() {
        try {
            const res = await fetch(`${API_BASE}/plugins`);
            const plugins = await res.json();

            const html = plugins.map(p => `
                    <div class="flex flex-col p-3 border rounded-lg ${p.active ? 'bg-green-50 border-green-300' : 'bg-gray-50 border-gray-200'}">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <div class="font-bold text-gray-800">${p.pluginName}</div>
                                <div class="text-xs text-gray-500 font-mono mt-1">ID: ${p.pluginId}</div>
                            </div>
                        </div>
                        <div class="flex gap-2 w-full mt-2 border-t pt-2">
                            <button onclick="togglePlugin('${p.pluginId}')"
                                    class="flex-1 py-1.5 rounded text-sm font-bold transition ${p.active ? 'bg-orange-500 text-white hover:bg-orange-600' : 'bg-green-500 text-white hover:bg-green-600'}">
                                ${p.active ? 'TẮT PLUGIN' : 'BẬT PLUGIN'}
                            </button>
                            <button onclick="deletePlugin('${p.pluginId}')"
                                    class="px-4 py-1.5 rounded text-sm font-bold bg-red-100 text-red-600 hover:bg-red-200 transition">
                                XÓA
                            </button>
                        </div>
                    </div>
                `).join('');
            document.getElementById('plugin-list').innerHTML = html || '<p class="text-gray-500 italic text-center py-4">Chưa có plugin nào.</p>';
        } catch (error) {
            console.error("Lỗi load plugin:", error);
        }
    }

    // 2. Bật/Tắt Plugin
    async function togglePlugin(id) {
        await fetch(`${API_BASE}/plugins/${id}/toggle`, { method: 'POST' });
        loadPlugins();
        loadPosts();
    }

    // 3. Upload Plugin Mới
    async function uploadPlugin() {
        const fileInput = document.getElementById('plugin-file');
        const file = fileInput.files[0];
        const className = document.getElementById('plugin-class').value.trim();

        if(!file || !className) {
            return alert("Vui lòng chọn file .jar và nhập đầy đủ tên Class (Ví dụ: com.demo.MyPlugin)!");
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("className", className);

        try {
            const response = await fetch(`${API_BASE}/plugins/upload`, {
                method: 'POST',
                body: formData
            });

            if(response.ok) {
                alert("Tải lên và nạp Plugin thành công!");
                fileInput.value = ''; // Reset form
                document.getElementById('plugin-class').value = '';
                loadPlugins();
            } else {
                alert("Có lỗi xảy ra, check lại file jar hoặc tên class nhé!");
            }
        } catch (error) {
            alert("Lỗi kết nối đến Server!");
        }
    }

    // 4. Xóa Plugin
    async function deletePlugin(id) {
        if(!confirm("Bạn có chắc chắn muốn gỡ bỏ plugin này khỏi bộ nhớ?")) return;

        await fetch(`${API_BASE}/plugins/${id}`, { method: 'DELETE' });
        loadPlugins();
        loadPosts();
    }

    // 5. Đăng bài viết
    async function createPost() {
        const title = document.getElementById('post-title').value.trim();
        const content = document.getElementById('post-content').value.trim();

        if(!title || !content) return alert("Bác nhập đủ tiêu đề và nội dung đi!");

        await fetch(`${API_BASE}/posts`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
        });

        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        loadPosts();
    }

    // 6. Lấy danh sách bài viết
    async function loadPosts() {
        try {
            const res = await fetch(`${API_BASE}/posts`);
            const posts = await res.json();

            const html = posts.reverse().map(p => `
                    <div class="p-5 border border-gray-200 rounded-lg bg-gray-50 hover:shadow-md transition">
                        <h3 class="font-bold text-lg text-blue-800">${p.title}</h3>
                        <p class="mt-3 text-gray-700 whitespace-pre-wrap leading-relaxed">${p.content}</p>
                    </div>
                `).join('');
            document.getElementById('post-list').innerHTML = html || '<p class="text-gray-500 italic text-center py-6">Chưa có bài viết nào được đăng.</p>';
        } catch (error) {
            console.error("Lỗi load bài viết:", error);
        }
    }

    // Khởi chạy khi load trang
    loadPlugins();
    loadPosts();
</script>
</body>
</html>
