services:
  app:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    # Thêm dòng này để lỡ Nodejs chạy nhanh quá, DB chưa kịp boot xong làm rớt mạng thì Nodejs tự khởi động lại để gọi DB tiếp.
    restart: always 

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb