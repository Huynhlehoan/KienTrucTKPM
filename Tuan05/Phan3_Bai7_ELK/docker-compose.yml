services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Tắt mật khẩu cho dễ test
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Khóa mõm RAM ở 512MB
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    ports:
      - "5601:5601"
    environment:
      # Báo cho Kibana biết chỗ để chui vào Elasticsearch
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200 
    depends_on:
      - elasticsearch

volumes:
  es_data: